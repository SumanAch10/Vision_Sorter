# TLS ingress. The certificates are mounted at runtime, never copied into images.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_body_timeout 15s;
    client_max_body_size 10m;
    keepalive_timeout 5s;
    limit_req_zone $binary_remote_addr zone=inference:1m rate=60r/m;
    limit_req_status 429;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/tls/server.crt;
        ssl_certificate_key /run/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        ssl_session_tickets off;
        error_page 413 = @oversized;
        error_page 429 = @rate_limited;
        location @oversized {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 413 '{"error":"image_size_limit","message":"Image exceeds 10 MiB","request_id":"$request_id","retryable":false}';
        }
        location @rate_limited {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            add_header Retry-After 1 always;
            return 429 '{"error":"rate_limited","message":"Ingress request rate exceeded","request_id":"$request_id","retryable":true}';
        }
        location = /v1/infer {
            limit_req zone=inference burst=10 nodelay;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location / {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
