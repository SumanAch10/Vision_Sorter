[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-sorter"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3", "Pillow>=11,<13", "torch>=2.5,<3", "torchvision>=0.20,<0.30",
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "matplotlib>=3.9,<4", "ruff>=0.9,<1"]

[project.scripts]
vision-sorter = "vision_sorter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vision_sorter = ["index.html", "static/*"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
