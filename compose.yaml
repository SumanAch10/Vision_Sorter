services:
  api:
    build: .
    image: ${SORTER_IMAGE:-vision-sorter:0.3.0}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SORTER_PUBLISHED_PORT:-8000}:8000"
    environment:
      SORTER_API_KEY_FILE: /run/secrets/sorter_api_key
      SORTER_RATE_LIMIT: "60"
      SORTER_REQUEST_TIMEOUT: "15"
    secrets:
      - sorter_api_key
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 35s
secrets:
  sorter_api_key:
    file: ${SORTER_SECRET_FILE:-./.secrets/api_key}
